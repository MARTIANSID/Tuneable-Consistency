syntax = "proto3";
option java_multiple_files = true;
package org.ds.rl;

service RLBudgetService {
  // Get budget prediction from the model
  rpc PredictBudget(BudgetRequest) returns (BudgetResponse);
  
  // Send training sample to the model (for online learning)
  rpc RecordExperience(Experience) returns (AckResponse);
  
  // Check model health
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
  
  // Get model statistics
  rpc GetModelStats(StatsRequest) returns (StatsResponse);
}

message BudgetRequest {
  double current_load = 1;
  double current_throughput = 2;
  double current_backlog = 3;
  double avg_wc_cost = 4;
  double utilization = 5;
}

message BudgetResponse {
  double predicted_budget = 1;
  int32 action_index = 2;
  double confidence = 3;
  bool success = 4;
  string error_message = 5;
}

message Experience {
  // Current state
  double current_load = 1;
  double current_throughput = 2;
  double current_backlog = 3;
  double avg_wc_cost = 4;
  double utilization = 5;
  
  // Action taken
  double budget_used = 6;
  
  // Result
  double profit = 7;
  int32 transactions_processed = 8;
  int32 transactions_upgraded = 9;
  
  // Next state
  double next_load = 10;
  double next_throughput = 11;
  double next_backlog = 12;
  double next_avg_wc_cost = 13;
  double next_utilization = 14;
  
  // Metadata
  int64 timestamp = 15;
}

message AckResponse {
  bool success = 1;
  string message = 2;
}

message HealthRequest {
}

message HealthResponse {
  bool is_healthy = 1;
  bool model_loaded = 2;
  int32 training_samples_count = 3;
  double epsilon = 4;
  int32 training_steps = 5;
}

message StatsRequest {
}

message StatsResponse {
  int32 total_predictions = 1;
  int32 total_training_samples = 2;
  double avg_loss = 3;
  double avg_reward = 4;
  int64 last_training_time = 5;
}
