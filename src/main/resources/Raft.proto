syntax = "proto3";
option java_multiple_files = true;
option java_package = "org.example.raft";
package raft;

// ============================================================
// Raft internals (server to server)
// ============================================================

service Raft {
  rpc AppendEntries(AppendEntriesArgument) returns (AppendEntriesResult);
  rpc RequestVote(RequestVoteArguments) returns (RequestVoteResult);
}

// Log entries are pure KV writes. Reads never enter the log: linearizable
// reads use ReadIndex, everything else serves from local state.
message LogEntryProto {
  int32 logIndex = 1;
  int32 term = 2;
  string key = 3;
  string value = 4;
  string opId = 5;
}

message AppendEntriesArgument {
  int32 leadersTerm = 1;
  int32 leadersId = 2;
  int32 prevLogIndex = 3;
  int32 prevLogTerm = 4;
  repeated LogEntryProto entries = 5;
  int32 leadersCommit = 6;
}

message AppendEntriesResult {
  int32 currentTerm = 1;
  bool isSuccessFull = 2;
  int32 followerId = 3;
}

message RequestVoteArguments {
  int32 candidatesTerm = 1;
  int32 candidateId = 2;
  int32 lastLogIndex = 3;
  int32 lastLogTerm = 4;
}

message RequestVoteResult {
  int32 currentTerm = 1;
  bool isVoteGranted = 2;
}

// ============================================================
// Client protocol (Chameleon)
// ============================================================

service KvClient {
  // Bidirectional session stream. Requests and responses are correlated by
  // requestId; responses may arrive out of order (waits overlap).
  rpc Session(stream KvRequest) returns (stream KvResponse);
}

// MongoDB-style read levels on Raft. LOCAL serves from the replica's log
// (may contain uncommitted entries a leader change can roll back), MAJORITY
// serves from majority-committed state.
enum ReadLevel {
  EVENTUAL_LOCAL = 0;
  EVENTUAL_MAJORITY = 1;
  CAUSAL_LOCAL = 2;
  CAUSAL_MAJORITY = 3;
  LINEARIZABLE = 4;
}

// Log indices in this protocol are 0-based; -1 means "none". Clients must
// set the session index fields explicitly on every request. The request
// carries no consistency level, no deadline, and no profit values: the
// server chooses the level from the registered SLA (applicationId, slaId)
// and the current shadow price.
message KvRequest {
  int64 requestId = 1;
  int32 applicationId = 2;
  int32 slaId = 3;
  bool isRead = 4;
  string key = 5;
  string value = 6;                  // writes only
  int32 committedSessionIndex = 7;   // causal-majority anchor, -1 = none
  int32 uncommittedSessionIndex = 8; // causal-local anchor, -1 = none
  double rttEstimateMs = 9;          // client's RTT estimate to this server

  // 10, 11 were the stage 2 forced-level fields, removed with the scorer.
  reserved 10, 11;
}

// satisfiedRung is added in stage 4 when SLAs exist.
message KvResponse {
  int64 requestId = 1;
  bool ok = 2;
  bool notLeader = 3;                // redirect: resend to leaderId
  int32 leaderId = 4;                // valid when notLeader; -1 = unknown
  string value = 5;                  // reads; "" when the key is absent
  int32 valueIndex = 6;              // log index of the returned value's write (write: the entry's index); -1 = absent
  ReadLevel deliveredReadLevel = 7;
  int32 deliveredWriteConcern = 8;   // replication count at acknowledgment
  bool waited = 9;                   // request waited server-side (excluded from RTT sampling)
  bool timedOutAndFellBack = 10;     // wait expired; served at the strongest no-wait level
  int32 logIndex = 11;               // node's last log index at reply
  int32 commitIndex = 12;            // node's commit index at reply
  double serviceTimeMs = 13;         // reply time minus t_recv, monotonic clock
  bool rejected = 14;                // admission control shed this request (max V_c <= 0 or a hard backstop)
}
